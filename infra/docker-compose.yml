# Local development dependencies for CODEK.
# Usage: docker compose -f infra/docker-compose.yml up -d
# Credentials here are LOCAL DEVELOPMENT ONLY and must never be reused in staging/production.
name: codek-dev
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: codek
      POSTGRES_PASSWORD: codek_dev_password
      POSTGRES_DB: codek_dev
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codek -d codek_dev"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  # Optional S3-compatible storage for local testing of STORAGE_DRIVER=s3.
  minio:
    image: minio/minio:latest
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: codek-dev
      MINIO_ROOT_PASSWORD: codek-dev-secret
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - miniodata:/data
  # Optional local SMTP catcher for EMAIL_DRIVER=smtp (SMTP_HOST=localhost SMTP_PORT=1025).
  mailpit:
    image: axllent/mailpit:latest
    profiles: ["mail"]
    ports: ["1025:1025", "8025:8025"]
volumes:
  pgdata:
  redisdata:
  miniodata:
