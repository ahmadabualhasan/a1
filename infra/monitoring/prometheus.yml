# Example scrape configuration (adjust targets to your platform's service discovery).
global:
  scrape_interval: 30s
rule_files:
  - alerts.yml
scrape_configs:
  - job_name: codek-api
    metrics_path: /api/v1/metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/codek-metrics-token
    static_configs:
      - targets: ['api:4000']
